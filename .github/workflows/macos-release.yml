name: macOS CI and preview release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.12.0
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "13.5"

jobs:
  verify:
    name: Editor and service regression tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: mkdir -p design/validation
      - run: npm test
      - run: node --test tests/release-helpers.test.mjs tests/updater-release.test.mjs
      - run: npm run test:backend
      - run: npm run build
      - run: npx playwright install chromium
      - name: Browser workflows against isolated development host
        shell: bash
        run: |
          set -euo pipefail
          node scripts/dev.mjs > design/validation/ci-dev.log 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true; wait "$dev_pid" 2>/dev/null || true' EXIT
          node scripts/wait-for-dev.mjs
          npm run test:ui

  build:
    name: Build Apple silicon DMG
    needs: verify
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Native architecture guard
        env:
          EXPECTED_ARCH: arm64
        run: node -e 'if(process.platform!=="darwin"||process.arch!==process.env.EXPECTED_ARCH)throw new Error("Runner architecture does not match the release target")'
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action, pinned Rust below
        with:
          toolchain: 1.99.1
          targets: aarch64-apple-darwin
          components: rustfmt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: macos-arm64-rust-1.99.1-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: macos-arm64-rust-1.99.1-
      - run: npm ci
      - run: mkdir -p design/validation
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: npm test
      - run: node --test tests/release-helpers.test.mjs tests/updater-release.test.mjs
      - run: npm run test:backend
      - name: Assemble verified bundled runtimes
        run: |
          npm run runtime:setup
          npm run runtime:remote -- x64
          npm run runtime:remote -- arm64
      - name: Build the native app from lockfiles
        env:
          EXPECTED_ARCH: arm64
        run: npx tauri build --bundles app --ci -- --locked
      - name: Native tests with assembled runtime and frontend resources
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Ad-hoc sign and verify preview
        run: node scripts/sign-preview.mjs
      - name: Actual packaged app, bundled languages, CLI and recovery smoke
        run: npm run test:package
      - name: Verify exact source, frontend and bundled resources
        run: node scripts/verify-package.mjs
      - name: Create Apple silicon DMG and validation metadata
        env:
          EXPECTED_ARCH: arm64
        run: node scripts/package-release.mjs --out-dir release-artifacts
      - name: Package application and AGPL dependency sources
        run: node scripts/package-source.mjs
      - name: Create and verify signed automatic update archive
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/package-updater.mjs
      - name: Rehearse verified update installation and relaunch in an isolated app
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          export ISLET_UPDATE_TEST_ARCHIVE="$PWD/release-artifacts/Islet_${version}_macos_arm64.app.tar.gz"
          export ISLET_UPDATE_TEST_SIGNATURE="$ISLET_UPDATE_TEST_ARCHIVE.sig"
          export ISLET_UPDATE_TEST_APP="$PWD/src-tauri/target/release/bundle/macos/Islet.app"
          cargo test --manifest-path src-tauri/Cargo.toml --locked actual_signed_archive_download_install_and_relaunch -- --ignored --nocapture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: islet-macos-arm64
          path: release-artifacts/*
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish macOS preview downloads
    needs: [verify, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-15
    timeout-minutes: 15
    concurrency:
      group: islet-updater-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: islet-macos-arm64
          path: release-artifacts
      - name: Publish only after the Apple silicon DMG is verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
