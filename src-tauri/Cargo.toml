[package]
name = "islet"
version = "0.1.12"
description = "A focused desktop code editor"
license = "AGPL-3.0-only"
authors = ["Islet contributors"]
edition = "2021"

[lib]
name = "islet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
rfd = "0.15"
tauri-plugin-updater = "2"
reqwest = { version = "0.13", default-features = false }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSString"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSMenu", "NSMenuItem"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
base64 = "0.22"
